顯示uosc菜單	script-binding uosc/menu

載入 (&L)
	剪貼簿URL (&C)		update-clipboard text; loadfile ${clipboard/text}; show-text '+ ${clipboard/text}'
軌道聚合列表	$tracks

導航 (&N)
	播放列表 (&P)		$playlist
	版本列表 (&E)		$editions
	章節列表 (&C)		$chapters

	影片軌列表 (&V)		$video-tracks
	音訊軌列表 (&A)		$audio-tracks
	字幕軌列表 (&S)		$sub-tracks

	播放列表亂序重排 (&R)	playlist-shuffle
播放 (&P)
	上一幀						frame-back-step
	下一幀						frame-step
	設置/清除 AB循環點 (&A)		ab-loop
	速度 (&S)
		50%			set speed 0.5	checked=speed == 0.5
		100% (&1)	set speed 1		checked=speed == 1
		150% (&2)	set speed 1.5	checked=speed == 1.5
		200% (&3)	set speed 2		checked=speed == 2

	音量 -		add volume -1
	音量 +		add volume  1

	音訊預載 100ms		add audio-delay -0.1
	音訊延遲 100ms		add audio-delay  0.1
	字幕預載 100ms		add sub-delay -0.1
	字幕延遲 100ms		add sub-delay  0.1

	重設 音訊與字幕同步 (&R)	set audio-delay 0; set sub-delay 0

VF 濾鏡 (&F)
	清空 (&C)	vf clr ""

	預設 補幀 MVTools_快速			vf set vapoursynth="~~/vs/MEMC_MVT_LQ.vpy"
	預設 補幀 RIFE_DX12				vf set vapoursynth="~~/vs/MEMC_RIFE_DML.vpy"
	預設 補幀 DRBA_DX12				vf set vapoursynth="~~/vs/MEMC_DRBA_DML.vpy"
	預設 補幀 RIFE_RTX (DLC-vsNV)	vf set vapoursynth="~~/vs/MEMC_RIFE_NV.vpy"
	預設 補幀 DRBA_RTX (DLC-vsNV)	vf set vapoursynth="~~/vs/MEMC_DRBA_NV.vpy"

	預設 自訂AI UAI_DX12				vf set vapoursynth="~~/vs/MIX_UAI_DML.vpy"
	預設 自訂AI UAI_RTX (DLC-vsNV)	vf set vapoursynth="~~/vs/MIX_UAI_NV_TRT.vpy"
著色器 (&G)
	清空 (&C)	change-list glsl-shaders clr ""

	開關 LUMA: Ani4Kv2		change-list glsl-shaders toggle "~~/shaders/Ani/Ani4Kv2_ArtCNN_C4F32_i2.glsl"
	開關 LUMA: AniSD		change-list glsl-shaders toggle "~~/shaders/Ani/AniSD_ArtCNN_C4F32_i4.glsl"
	開關 LUMA: FSRCNNX		change-list glsl-shaders toggle "~~/shaders/FSRCNNX/FSRCNNX_x2_16_0_4_1.glsl"
	開關 LUMA: NNEDI3		change-list glsl-shaders toggle "~~/shaders/EDI/nnedi3_nns64_win8x4.glsl"

	開關 MAIN: A4K_重建		change-list glsl-shaders toggle "~~/shaders/Anime4K/Anime4K_Restore_CNN_L.glsl"
	開關 MAIN: A4K_放大		change-list glsl-shaders toggle "~~/shaders/Anime4K/Anime4K_Upscale_GAN_x2_M.glsl"
	開關 MAIN: A4K_配置Q	change-list glsl-shaders toggle "~~/shaders/Anime4K/Anime4K_AIO_optQ.glsl"

	開關 POSTKERNEL: QCOM_主縮放銳化 RT (*)		change-list glsl-shaders toggle "~~/shaders/QCOM/QCOM_SGEDS_ms_RT.glsl"

	開關 SCALED: 自適應銳化lite RT		change-list glsl-shaders toggle "~~/shaders/Adaptive_sharpen/Adaptive_sharpen_lite_RT.glsl"

截圖 (&K)
	窗口-無OSD (&S)		screenshot scaled+subtitles
	窗口 (&W)			screenshot window
	原始 (&V)			screenshot video

影片 (&V)
	切換 解碼模式 (&H)		cycle-values hwdec "auto" "auto-copy" "no"
	切換 去色帶狀態 (&D)	cycle deband		checked=deband
	切換 去隔行狀態 (&I)	cycle deinterlace	checked=deinterlace_active
	切換 自動校色			cycle icc-profile-auto
	切換 時間碼解析模式		cycle correct-pts
	均衡器 (&E)
		對比度 -	add contrast -1
		對比度 +	add contrast  1
		亮度 -		add brightness -1
		亮度 +		add brightness  1
		伽馬 -		add gamma -1
		伽馬 +		add gamma  1
		飽和度 -	add saturation -1
		飽和度 +	add saturation  1
		色相 -		add hue -1
		色相 +		add hue  1

		重設 全部 (&R)		set contrast 0 ; set brightness 0 ; set gamma 0 ; set saturation 0 ; set hue 0

工具 (&T)
	按鍵綁定列表				script-binding select/select-binding
	常駐顯示統計資訊 (&S)		script-binding display-stats-toggle
	顯示OSD命令行/控制台 (&C)	script-binding commands/open
	清除已記錄的屬性值			script-message-to save_global_props clean_data
	切換 窗口邊框 (&B)			cycle border	checked=border
	切換 窗口置頂 (&O)			cycle ontop		checked=ontop
	按鍵名檢測					script-binding input_plus/input_test_toggle

	打開select總菜單 (&M)		script-binding select/menu
	打開select分菜單-屬性列表	script-binding select/show-properties
	音訊輸出設備列表 (&A)		$audio-devices

關於 (&I)
	項目首頁 (&H)	script-message-to input_plus lazy-helper 0
	mpv手冊 (&M)	script-message-to input_plus lazy-helper 1
	中文手冊 (&C)	script-message-to input_plus lazy-helper 2
	FAQ (&F)		script-message-to input_plus lazy-helper 3
	濾鏡指北		script-message-to input_plus lazy-helper 4
	著色器指南		script-message-to input_plus lazy-helper 5

停止 (&X)		stop	disabled=idle_active
退出mpv (&Q)	quit
